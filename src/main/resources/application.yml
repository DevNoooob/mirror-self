server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: mirror-self
  datasource:
    url: ${MIRROR_DB_URL:jdbc:postgresql://localhost:5432/mirror_self}
    username: ${MIRROR_DB_USER:mirror}
    password: ${MIRROR_DB_PASSWORD:}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
mirror:
  owner-id: ${MIRROR_OWNER_ID:11111111-1111-4111-8111-111111111111}
  owner-token: ${MIRROR_OWNER_TOKEN:}
  # Cloud calls additionally require an unexpired source-scoped grant via the API.
  model-egress-enabled: ${MIRROR_MODEL_EGRESS_ENABLED:false}
  extraction:
    mode: ${MIRROR_EXTRACTION_MODE:RULE}
    local: ${MIRROR_LLM_LOCAL:false}
    base-url: ${MIRROR_LLM_BASE_URL:https://api.openai.com/v1}
    api-key: ${MIRROR_LLM_API_KEY:}
    model: ${MIRROR_LLM_MODEL:}
    timeout: ${MIRROR_LLM_TIMEOUT:30s}
    batch-chars: ${MIRROR_LLM_BATCH_CHARS:16000}
    batch-messages: ${MIRROR_LLM_BATCH_MESSAGES:30}
